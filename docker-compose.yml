# ==============================================================================
# VAULTWARDEN - DEPLOIEMENT DOCKER POUR SERVEUR REVERSE-PROXY (CADDY)
# ==============================================================================
services:
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE:-vaultwarden/server:latest}
    container_name: ${CONTAINER_NAME:-vaultwarden}
    restart: unless-stopped
    environment:
      # URL publique d'accès (ex: https://coffre-fort.kapkali.com)
      - DOMAIN=${DOMAIN:-https://coffre-fort.kapkali.com}
      # Autorise les inscriptions pour créer le premier compte admin.
      # À passer impérativement à 'false' une fois votre compte créé !
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED:-true}
      - INVITATIONS_ALLOWED=${INVITATIONS_ALLOWED:-true}
      - SHOW_PASSWORD_HINT=${SHOW_PASSWORD_HINT:-false}
      # WebSocket pour la synchronisation en temps réel des extensions et applications
      - ENABLE_WEBSOCKET=${ENABLE_WEBSOCKET:-true}
      # Token d'administration /admin (laisser vide pour désactiver totalement la page /admin)
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}

      # ------------------------------------------------------------------------
      # BRANDING & TITRE (Templatisable via .env)
      # ------------------------------------------------------------------------
      - APP_NAME=${APP_NAME:-Gestionnaire MDP | CFAM976}
      - BRAND_SHORT=${BRAND_SHORT:-CFAM976}

      # ------------------------------------------------------------------------
      # CHARTE GRAPHIQUE & COULEURS (Templatisable via .env)
      # ------------------------------------------------------------------------
      # Action principale & Boutons CTA
      - COLOR_PRIMARY=${COLOR_PRIMARY:-#FF7F00}
      - COLOR_PRIMARY_HOVER=${COLOR_PRIMARY_HOVER:-#E06F00}
      # Structure, Grands titres & En-tête de navigation
      - COLOR_HEADER=${COLOR_HEADER:-#110979}
      # Fond sombre & Footer
      - COLOR_DARK=${COLOR_DARK:-#0B0654}
      # Fond neutre clair (alterné)
      - COLOR_LIGHT=${COLOR_LIGHT:-#F4F4F5}
      # Fond neutre blanc (conteneurs & cartes)
      - COLOR_WHITE=${COLOR_WHITE:-#FFFFFF}

      # Dossier où sont compilés les templates SCSS dynamiques
      - TEMPLATES_FOLDER=/app/templates
    volumes:
      # Stockage persistant des données chiffrées
      - ${DATA_VOLUME:-vw_data}:/data
      # Dossier des modèles SCSS
      - ./custom/templates:/custom/templates:ro
      # Logos servis en direct par le Web Vault (conforme CSP 'self')
      - ./custom/branding:/web-vault/images/custom:ro
      - ./custom/branding:/custom/branding:ro
      # Script d'injection dynamique au boot du conteneur
      - ./custom/init.d:/etc/vaultwarden.d:ro
    networks:
      - web-network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ==============================================================================
# RESEAUX
# ==============================================================================
networks:
  # Connexion directe au réseau externe du proxy Caddy
  web-network:
    external: true
    name: ${WEB_NETWORK:-web-network}

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  vw_data:
    name: ${DATA_VOLUME:-vw_data}
